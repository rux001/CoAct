name: coact
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch-cuda=12.1
  - pip:
      # Core ML stack (pinned to the versions used for the paper results)
      - torch==2.9.0
      - transformers==4.57.3
      - datasets==3.6.0
      - accelerate==1.11.0
      - deepspeed==0.16.4
      - peft==0.15.2
      - trl==0.9.6
      - vllm==0.12.0
      - huggingface-hub==0.36.0

      # API clients
      - openai==2.9.0
      - requests==2.32.5

      # Utilities
      - numpy==1.26.4
      - scikit-learn==1.7.2
      - tqdm==4.67.1
      - PyYAML==6.0.3

      # NOTE: LLaMA-Factory must be installed separately from source — see README.md.
      # After activating this environment:
      #   git clone https://github.com/hiyouga/LLaMA-Factory.git
      #   cd LLaMA-Factory && git checkout 5ed62a29c5bfcb0eee00bb4d920bb68ca0c4514c
      #   pip install -e .
